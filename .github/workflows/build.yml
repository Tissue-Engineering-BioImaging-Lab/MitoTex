name: Build MitoTex Cross-Platform Executables

on:
  push:
    branches: [ contesini_quick-refact-for-deployment ]
  pull_request:
    branches: [ contesini_quick-refact-for-deployment ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ['3.9']
        
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Debug - Show repository contents
      run: |
        echo "Current directory:"
        pwd
        echo "Repository contents:"
        ls -la
        echo "Python files:"
        find . -name "*.py" -type f | head -20
      shell: bash
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Verify Python installation
      run: |
        echo "=== Python Information ==="
        python --version
        python -m pip --version
        which python
        echo "=== Environment ==="
        echo "Runner OS: ${{ runner.os }}"
        echo "Python version: ${{ matrix.python-version }}"
      shell: bash
    
    - name: Check for required files
      run: |
        echo "=== Checking for required files ==="
        if [ -f "mito_feature_extraction_gui.py" ]; then
          echo "✓ Main source file found"
        else
          echo "✗ ERROR: mito_feature_extraction_gui.py not found!"
          echo "Available Python files:"
          find . -name "*.py" -type f
        fi
        
        if [ -f "requirements.txt" ]; then
          echo "✓ requirements.txt found"
          echo "Contents:"
          cat requirements.txt
        else
          echo "⚠ WARNING: requirements.txt not found"
        fi
        
        if [ -d "doc/logos" ]; then
          echo "✓ doc/logos directory found"
        else
          echo "⚠ WARNING: doc/logos directory not found"
        fi
      shell: bash
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      continue-on-error: false
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          libgl1-mesa-glx \
          libglib2.0-0 \
          gcc \
          g++ \
          build-essential
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      continue-on-error: false
      run: |
        brew install tcl-tk
    
    - name: Install system dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "Checking for Visual C++ build tools..."
        # GitHub Actions Windows runners already have VS Build Tools
        # Just ensure we have the latest Visual C++ redistributables
        $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (Test-Path $vsWhere) {
          Write-Host "Visual Studio components found:"
          & $vsWhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        } else {
          Write-Host "Visual Studio not found via vswhere, but build tools may still be available"
        }
        Write-Host "Windows SDK and build tools should be pre-installed on GitHub runners"
    
    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip list
      shell: bash
    
    - name: Install numpy and Cython (required for pyradiomics)
      run: |
        pip install numpy==1.25.1 Cython
    
    - name: Install Python dependencies (excluding pyradiomics)
      run: |
        if [ -f "requirements.txt" ]; then
          echo "Installing from requirements.txt (excluding pyradiomics)..."
          grep -v pyradiomics requirements.txt > temp_requirements.txt || echo "No pyradiomics to exclude"
          if [ -s temp_requirements.txt ]; then
            pip install -r temp_requirements.txt
          else
            echo "temp_requirements.txt is empty, installing base dependencies..."
            pip install opencv-python pillow pandas scikit-learn simpleitk ttkbootstrap
          fi
          rm -f temp_requirements.txt
        else
          echo "No requirements.txt found, installing common dependencies..."
          pip install opencv-python pillow pandas scikit-learn simpleitk ttkbootstrap
        fi
      shell: bash
    
    - name: Install pyradiomics with no build isolation
      run: |
        echo "Installing pyradiomics with C extension support..."
        pip install --no-build-isolation pyradiomics==3.0.1 || {
          echo "Failed to install pyradiomics 3.0.1, trying without version pin..."
          pip install --no-build-isolation pyradiomics
        }
      shell: bash
    
    - name: Install PyInstaller
      run: |
        pip install pyinstaller==6.3.0
    
    - name: Verify source file exists
      run: |
        if [ ! -f "mito_feature_extraction_gui.py" ]; then
          echo "Error: Source file not found!"
          echo "Contents of current directory:"
          ls -la
          exit 1
        fi
        echo "Source file found."
      shell: bash
    
    - name: Verify doc/logos directory exists
      run: |
        if [ ! -d "doc/logos" ]; then
          echo "Warning: doc/logos directory not found!"
          echo "Contents of doc directory:"
          ls -la doc/ || echo "doc directory does not exist"
          mkdir -p doc/logos
          echo "Created empty doc/logos directory"
        else
          echo "doc/logos directory found."
        fi
      shell: bash
    
    - name: Create version file
      run: |
        python -c "import json; json.dump({'commit': '${{ github.sha }}'[:7], 'branch': '${{ github.ref_name }}', 'date': '${{ github.event.head_commit.timestamp }}'}, open('version.json', 'w'))"
    
    - name: Build executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile \
          --windowed \
          --name=MitoTex-Linux \
          --add-data "doc/logos:doc/logos" \
          --add-data "version.json:." \
          --hidden-import=numpy.core._multiarray_umath \
          --hidden-import=numpy._core._multiarray_umath \
          --hidden-import=radiomics \
          --hidden-import=radiomics.featureextractor \
          --hidden-import=radiomics._cmatrices \
          --hidden-import=SimpleITK \
          --hidden-import=PIL \
          --hidden-import=PIL.Image \
          --hidden-import=PIL.ImageTk \
          --hidden-import=ttkbootstrap \
          --hidden-import=cv2 \
          --hidden-import=pandas \
          --hidden-import=sklearn \
          --hidden-import=sklearn.tree \
          --hidden-import=sklearn.svm \
          --hidden-import=sklearn.model_selection \
          --hidden-import=sklearn.metrics \
          --hidden-import=sklearn.ensemble \
          --hidden-import=sklearn.feature_selection \
          --collect-all radiomics \
          --collect-all ttkbootstrap \
          --log-level DEBUG \
          mito_feature_extraction_gui.py
    
    - name: Build executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onefile \
          --windowed \
          --name=MitoTex-macOS \
          --add-data "doc/logos:doc/logos" \
          --add-data "version.json:." \
          --hidden-import=numpy.core._multiarray_umath \
          --hidden-import=numpy._core._multiarray_umath \
          --hidden-import=radiomics \
          --hidden-import=radiomics.featureextractor \
          --hidden-import=radiomics._cmatrices \
          --hidden-import=SimpleITK \
          --hidden-import=PIL \
          --hidden-import=PIL.Image \
          --hidden-import=PIL.ImageTk \
          --hidden-import=ttkbootstrap \
          --hidden-import=cv2 \
          --hidden-import=pandas \
          --hidden-import=sklearn \
          --hidden-import=sklearn.tree \
          --hidden-import=sklearn.svm \
          --hidden-import=sklearn.model_selection \
          --hidden-import=sklearn.metrics \
          --hidden-import=sklearn.ensemble \
          --hidden-import=sklearn.feature_selection \
          --collect-all radiomics \
          --collect-all ttkbootstrap \
          --log-level DEBUG \
          mito_feature_extraction_gui.py
    
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "Starting PyInstaller build for Windows..."
        $logoPath = "doc/logos"
        if (-not (Test-Path $logoPath)) {
          Write-Host "Creating missing doc/logos directory..."
          New-Item -ItemType Directory -Force -Path $logoPath
        }
        
        pyinstaller --onefile `
          --windowed `
          --name=MitoTex-Windows `
          --add-data="${logoPath};doc/logos" `
          --add-data="version.json;." `
          --hidden-import=numpy.core._multiarray_umath `
          --hidden-import=numpy._core._multiarray_umath `
          --hidden-import=radiomics `
          --hidden-import=radiomics.featureextractor `
          --hidden-import=radiomics._cmatrices `
          --hidden-import=SimpleITK `
          --hidden-import=PIL `
          --hidden-import=PIL.Image `
          --hidden-import=PIL.ImageTk `
          --hidden-import=ttkbootstrap `
          --hidden-import=cv2 `
          --hidden-import=pandas `
          --hidden-import=sklearn `
          --hidden-import=sklearn.tree `
          --hidden-import=sklearn.svm `
          --hidden-import=sklearn.model_selection `
          --hidden-import=sklearn.metrics `
          --hidden-import=sklearn.ensemble `
          --hidden-import=sklearn.feature_selection `
          --collect-all=radiomics `
          --collect-all=ttkbootstrap `
          --log-level=DEBUG `
          mito_feature_extraction_gui.py
        
        if ($LASTEXITCODE -ne 0) {
          Write-Host "PyInstaller build failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "Build completed successfully!"
    
    - name: List build output
      if: always()
      run: |
        echo "Contents of dist directory:"
        ls -la dist/ || echo "dist directory does not exist"
        echo "Contents of build directory:"
        ls -la build/ || echo "build directory does not exist"
      shell: bash
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ runner.os }}
        path: |
          build/
          *.spec
          *.log
        retention-days: 7
    
    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MitoTex-${{ runner.os }}-${{ matrix.python-version }}
        path: dist/*
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}